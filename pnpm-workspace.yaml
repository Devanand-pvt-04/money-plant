packages:
  - apps/*
  - packages/*
  - services/ai-worker

# esbuild (used by tsx in services/ai-worker) ships its binary as a platform package; its install script only checks it.
allowBuilds:
  esbuild: false

# React Native native builds are more reliable with a flat node_modules.
nodeLinker: hoisted

# Security pass (decision 0016): node-forge comes in through Expo's CLI (build
# tooling, not the app) and has known flaws before 1.4.1. Drop this once Expo
# ships a fixed version.
overrides:
  node-forge: ^1.4.1

# picomatch <=4.0.7 (GHSA-fc5q-39xc-vjpf, ReDoS) comes in through Metro and
# jest-util (build tooling, not the app) and has no fixed release yet. Deva
# chose to ignore it for now (2026-11-18); drop this once picomatch ships a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf

# Web build (decision 0039): expo-sqlite's browser version gave up on a
# synchronous query after about 56 ms of waiting; the patch waits up to 30 s.
# Touches only web/WorkerChannel.ts, never the Android code.
patchedDependencies:
  expo-sqlite: patches/expo-sqlite.patch
