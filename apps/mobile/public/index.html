<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the app draw under the iPhone notch; screens keep clear of it with safe area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Home screen web app (decision 0039): opens full screen from the iPhone home screen. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Money Plant" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#F3F4F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121413" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #F3F4F2;
        /* No grey flash on tap and no text-size boost on rotate in Safari. */
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #121413;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Money Plant.</noscript>
    <div id="root"></div>
  </body>
</html>
