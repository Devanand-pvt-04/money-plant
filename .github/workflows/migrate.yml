name: Database migrations

# Applies supabase/migrations to the hosted project, the same as
# `npx supabase db push` from a PC. It runs:
# - by itself after a merge to main that adds or changes a migration;
# - before every OTA update (ota-update.yml calls it), so the phones never get
#   code that needs a column the server doesn't have yet;
# - by hand from Actions → Database migrations → Run workflow.
# Only migrations the server hasn't applied yet run; with none, it does nothing.
# Needs the repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD
# (docs/setup.md, section 4).

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/migrate.yml']
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_DB_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    # One push at a time, never cancelled halfway.
    concurrency:
      group: supabase-migrations
      cancel-in-progress: false
    env:
      PROJECT_REF: dywcmxixmzeqhzifuhwm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add the repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD (docs/setup.md, section 4)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          # Same pinned version as CI.
          version: 3.0.0
      - run: supabase link --project-ref "$PROJECT_REF"
      # What will run, in the log, before it runs.
      # CLI 3 targets the local stack unless told otherwise; --remote is the linked project.
      - name: Pending migrations
        run: supabase db push --remote --dry-run
      # No terminal to confirm on; the dry run above shows what --yes applies.
      - name: Apply
        run: supabase db push --remote --yes
