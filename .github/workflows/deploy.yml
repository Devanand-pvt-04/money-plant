name: Deploy

# Ships a merge to main to the server and the phones, in order, one step after
# another (each step waits for the one before it):
# 1. Database migrations (migrate.yml), when a migration changed;
# 2. Edge functions (functions.yml), only the ones whose folder changed;
# 3. OTA update to the phones (decision 0011), when the app or a shared package
#    changed. Same as `npx eas-cli@latest update` from apps/mobile, without a
#    Windows machine. It publishes to production (Deva's daily app; preview is
#    no longer in use, 2026-11-13), titled after the merged PR, and skips a merge
#    that moved app.json's version: that needs a new build.
# A step whose part didn't change is skipped. So the server always has what an
# edge function or the app needs before they reach it.
# By hand: Actions → Deploy → Run workflow, for either channel. That applies any
# pending migrations, deploys every edge function, then publishes the update.
# Migrations or functions alone: Actions → Database migrations / Edge functions.
# Needs the repository secrets EXPO_TOKEN, SUPABASE_ACCESS_TOKEN and
# SUPABASE_DB_PASSWORD (docs/setup.md, sections 4 and 11).
# Updates only reach builds whose app.json version matches the commit's.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/migrate.yml'
      - '.github/workflows/functions.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: Which app gets the update
        type: choice
        options: [production, preview]
        default: production
      message:
        description: What changed, shown in the Expo dashboard
        type: string
        required: true

# One deploy at a time per channel, so two runs never race.
concurrency:
  group: deploy-${{ inputs.channel || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # What this merge changed, so each later step runs only when it has work.
  changes:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.diff.outputs.migrations }}
      functions: ${{ steps.diff.outputs.functions }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: What changed
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD)
            has() { printf '%s\n' "$changed" | grep -qE "$1" && echo true || echo false; }
            migrations=$(has '^(supabase/migrations/|\.github/workflows/migrate\.yml$)')
            functions=$(has '^(supabase/functions/|supabase/config\.toml$|\.github/workflows/functions\.yml$)')
            app=$(has '^(apps/mobile/|packages/|pnpm-lock\.yaml$)')
          else
            # By hand, or no earlier commit to compare with: do everything.
            migrations=true functions=true app=true
          fi
          echo "Migrations: $migrations, edge functions: $functions, app: $app"
          { echo "migrations=$migrations"; echo "functions=$functions"; echo "app=$app"; } >> "$GITHUB_OUTPUT"

  migrate:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    uses: ./.github/workflows/migrate.yml
    secrets: inherit

  # After migrations, so a function never goes live before the columns it uses.
  functions:
    needs: [changes, migrate]
    if: ${{ !cancelled() && needs.migrate.result != 'failure' && needs.changes.outputs.functions == 'true' }}
    uses: ./.github/workflows/functions.yml
    secrets: inherit

  ota:
    needs: [changes, migrate, functions]
    # Runs when the app changed and neither server step failed (a skipped one is fine).
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # After a merge: a new app.json version means a new native build, which
      # no phone has yet, so there is nothing to update over the air.
      - name: Needs a new build?
        id: native
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            before=$(git show "$BEFORE:apps/mobile/app.json" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).expo.version)")
            now=$(node -e "process.stdout.write(require('./apps/mobile/app.json').expo.version)")
            if [ "$before" != "$now" ]; then
              echo "::notice::app.json version moved $before -> $now: build and install the new APK; no OTA published."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            node scripts/check-native-version.mjs "$BEFORE"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-workspace
        if: steps.native.outputs.skip != 'true'
      # Never ship a bundle that CI would reject.
      - run: pnpm typecheck
        if: steps.native.outputs.skip != 'true'
      - run: pnpm test
        if: steps.native.outputs.skip != 'true'
      - uses: expo/expo-github-action@v8
        if: steps.native.outputs.skip != 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # Android only: iOS has no build yet. Inputs go through env, never into the script text.
      - name: Publish
        if: steps.native.outputs.skip != 'true'
        working-directory: apps/mobile
        env:
          CHANNEL: ${{ inputs.channel || 'production' }}
          MESSAGE: ${{ inputs.message || github.event.head_commit.message }}
        # A merge commit becomes "Merge pull request #95: <the PR's title>"; anything else keeps its first line.
        run: |
          first=$(printf '%s\n' "$MESSAGE" | head -n 1)
          title=$(printf '%s\n' "$MESSAGE" | awk 'NF' | sed -n 2p)
          case "$first" in
            "Merge pull request "*) msg="${first%% from *}: $title" ;;
            *) msg="$first" ;;
          esac
          eas update --channel "$CHANNEL" --platform android --message "$msg" --non-interactive
