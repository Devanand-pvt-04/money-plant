name: Deploy

# Ships a merge to main to the server and the phones, in order, one step after
# another (each step waits for the one before it):
# 1. Database migrations (migrate.yml), when a migration changed;
# 2. Edge functions (functions.yml), only the ones whose folder changed;
# 3. OTA update to the phones (decision 0011), when the app or a shared package
#    changed. Same as `npx eas-cli@latest update` from apps/mobile, without a
#    Windows machine. It publishes to production (Deva's daily app; preview is
#    no longer in use, 2026-11-13), titled after the merged PR, and skips a merge
#    that moved app.json's version: that needs a new build.
# 4. Production APK build on EAS (decision 0036), when the merge moved
#    app.json's version. Started with --no-wait, so the run doesn't sit in EAS's
#    free build queue; the run's summary links the build page, where the APK
#    appears when it's done. Install it, then share it on the Drive link.
# 5. iPhone web app (decision 0039) to Cloudflare Pages, when the app or a
#    shared package changed. Skipped with a notice until the secrets
#    CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist (docs/setup.md, 14).
# A step whose part didn't change is skipped. So the server always has what an
# edge function or the app needs before they reach it.
# By hand: Actions → Deploy → Run workflow, for either channel. That applies any
# pending migrations, deploys every edge function, then publishes the update;
# tick "Build a production APK" to start a build too.
# Migrations or functions alone: Actions → Database migrations / Edge functions.
# Needs the repository secrets EXPO_TOKEN, SUPABASE_ACCESS_TOKEN and
# SUPABASE_DB_PASSWORD (docs/setup.md, sections 4 and 11).
# Updates only reach builds whose app.json version matches the commit's.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/migrate.yml'
      - '.github/workflows/functions.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: Which app gets the update
        type: choice
        options: [production, preview]
        default: production
      message:
        description: What changed, shown in the Expo dashboard
        type: string
        required: true
      build:
        description: Build a production APK
        type: boolean
        default: false

# One deploy at a time per channel, so two runs never race.
concurrency:
  group: deploy-${{ inputs.channel || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # What this merge changed, so each later step runs only when it has work.
  changes:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.diff.outputs.migrations }}
      functions: ${{ steps.diff.outputs.functions }}
      app: ${{ steps.diff.outputs.app }}
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: What changed
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD)
            has() { printf '%s\n' "$changed" | grep -qE "$1" && echo true || echo false; }
            migrations=$(has '^(supabase/migrations/|\.github/workflows/migrate\.yml$)')
            functions=$(has '^(supabase/functions/|supabase/config\.toml$|\.github/workflows/functions\.yml$)')
            app=$(has '^(apps/mobile/|packages/|pnpm-lock\.yaml$)')
            # A moved app.json version needs a new APK (step 4).
            version() { node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).expo.version)"; }
            native=false
            if [ "$(git show "$BEFORE:apps/mobile/app.json" | version)" != "$(version < apps/mobile/app.json)" ]; then native=true; fi
          else
            # By hand, or no earlier commit to compare with: do everything, and build only when asked.
            migrations=true functions=true app=true native=false
          fi
          echo "Migrations: $migrations, edge functions: $functions, app: $app, new build: $native"
          { echo "migrations=$migrations"; echo "functions=$functions"; echo "app=$app"; echo "native=$native"; } >> "$GITHUB_OUTPUT"

  migrate:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    uses: ./.github/workflows/migrate.yml
    secrets: inherit

  # After migrations, so a function never goes live before the columns it uses.
  functions:
    needs: [changes, migrate]
    if: ${{ !cancelled() && needs.migrate.result != 'failure' && needs.changes.outputs.functions == 'true' }}
    uses: ./.github/workflows/functions.yml
    secrets: inherit

  ota:
    needs: [changes, migrate, functions]
    # Runs when the app changed and neither server step failed (a skipped one is fine).
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # After a merge: a new app.json version means a new native build, which
      # no phone has yet, so there is nothing to update over the air.
      - name: Needs a new build?
        id: native
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            before=$(git show "$BEFORE:apps/mobile/app.json" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).expo.version)")
            now=$(node -e "process.stdout.write(require('./apps/mobile/app.json').expo.version)")
            if [ "$before" != "$now" ]; then
              echo "::notice::app.json version moved $before -> $now: build and install the new APK; no OTA published."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            node scripts/check-native-version.mjs "$BEFORE"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-workspace
        if: steps.native.outputs.skip != 'true'
      # Never ship a bundle that CI would reject.
      - run: pnpm typecheck
        if: steps.native.outputs.skip != 'true'
      - run: pnpm test
        if: steps.native.outputs.skip != 'true'
      - uses: expo/expo-github-action@v8
        if: steps.native.outputs.skip != 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # Android only: iOS has no build yet. Inputs go through env, never into the script text.
      - name: Publish
        if: steps.native.outputs.skip != 'true'
        working-directory: apps/mobile
        env:
          CHANNEL: ${{ inputs.channel || 'production' }}
          MESSAGE: ${{ inputs.message || github.event.head_commit.message }}
        # A merge commit becomes "Merge pull request #95: <the PR's title>"; anything else keeps its first line.
        run: |
          first=$(printf '%s\n' "$MESSAGE" | head -n 1)
          title=$(printf '%s\n' "$MESSAGE" | awk 'NF' | sed -n 2p)
          case "$first" in
            "Merge pull request "*) msg="${first%% from *}: $title" ;;
            *) msg="$first" ;;
          esac
          eas update --channel "$CHANNEL" --platform android --message "$msg" --non-interactive

  # Decision 0036: a merge that moves app.json's version gets its production APK
  # without anyone running eas build on a PC. EAS's free plan has a monthly build
  # allowance; a build only starts on a version bump or when asked.
  build:
    needs: [changes, migrate, functions]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.native == 'true' || inputs.build) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # Never build an APK that CI would reject.
      - run: pnpm typecheck
      - run: pnpm test
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # The build runs on EAS; the version code goes up there (appVersionSource remote, autoIncrement).
      - name: Start the production build
        working-directory: apps/mobile
        run: |
          eas build --profile production --platform android --non-interactive --no-wait --json > "$RUNNER_TEMP/build.json"
          node -e '
            const [build] = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const app = require("./app.json").expo;
            const page = `https://expo.dev/accounts/${app.owner}/projects/${app.slug}/builds/${build.id}`;
            console.log(`::notice::Production APK ${app.version} build started: ${page}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `## Production APK ${app.version}\n\nThe build is running on EAS. The APK appears on [its build page](${page}) when it finishes (the free plan can queue for a while).\n\nInstall it over the old app, then upload it to the Drive link for friends.\n`);
          ' "$RUNNER_TEMP/build.json"

  # Decision 0039: the iPhone web app, built from the same code and published to
  # Cloudflare Pages (free). Runs beside the OTA update; the web app only talks
  # to Supabase, which steps 1 and 2 have already updated.
  web:
    needs: [changes, migrate, functions]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Its address is https://<project>.pages.dev.
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'money-plant' }}
    steps:
      - name: Cloudflare set up?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets yet, so the web app wasn't published (docs/setup.md, section 14)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.ready.outputs.go == 'true'
      - uses: ./.github/actions/setup-workspace
        if: steps.ready.outputs.go == 'true'
      # Never publish a build that CI would reject.
      - run: pnpm typecheck
        if: steps.ready.outputs.go == 'true'
      - run: pnpm test
        if: steps.ready.outputs.go == 'true'
      - name: Build the web app
        if: steps.ready.outputs.go == 'true'
        run: pnpm --filter @money-plant/mobile web:build
      - name: Publish to Cloudflare Pages
        if: steps.ready.outputs.go == 'true'
        working-directory: apps/mobile
        run: |
          # The first run makes the project; later runs find it there already.
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true
          printf '## iPhone web app\n\nPublished to the Cloudflare Pages project %s, usually at https://%s.pages.dev (the address is in the Cloudflare dashboard under Workers & Pages).\n' "$PROJECT" "$PROJECT" >> "$GITHUB_STEP_SUMMARY"
