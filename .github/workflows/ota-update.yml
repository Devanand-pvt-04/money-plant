name: OTA update

# Publishes a JavaScript-only update to the phones (decision 0011), from the
# Actions tab: Run workflow, pick the channel, describe the change. Same as
# `npx eas-cli@latest update` from apps/mobile, without a Windows machine.
# Needs the EXPO_TOKEN repository secret (docs/setup.md, section 11).
# Database migrations are applied first (migrate.yml), so an update never
# reaches the phones before the server changes it needs.
# Updates only reach builds whose app.json version matches the commit's.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Which app gets the update. Try preview first.
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: What changed, shown in the Expo dashboard
        type: string
        required: true

# One publish at a time per channel, so two runs never race.
concurrency:
  group: ota-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    uses: ./.github/workflows/migrate.yml
    secrets: inherit

  publish:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Never ship a bundle that CI would reject.
      - run: pnpm typecheck
      - run: pnpm test
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # Android only: iOS has no build yet. Inputs go through env, never into the script text.
      - name: Publish
        working-directory: apps/mobile
        env:
          CHANNEL: ${{ inputs.channel }}
          MESSAGE: ${{ inputs.message }}
        run: eas update --channel "$CHANNEL" --platform android --message "$MESSAGE" --non-interactive
