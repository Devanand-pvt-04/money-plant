name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Security pass (decision 0016): fail on high or critical advisories in shipped dependencies.
      - run: pnpm audit --prod --audit-level high

  # Row-level security tests: one user can't read or change another's rows (decision 0016).
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
      - run: supabase db advisors --fail-on warn

  # Fails if a key, token or password is committed anywhere in history.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --no-banner --redact

  cas-parser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cas-parser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/cas-parser/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
